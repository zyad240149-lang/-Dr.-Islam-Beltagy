<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#223468">
  <title>لا يوجد اتصال — عيادة د. إسلام بلتاجي</title>
  <style>
    :root { --brand: #223468; --ink: #172b3a; --muted: #5b6b7a; --bg: #f5f7fa; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e8edf3; --muted: #9fb0c0; --bg: #0f1720; --card: #17212c; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { background: var(--card); border-radius: 16px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 20px; }
    button { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/icon.svg" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>لم يُحمَّل التطبيق على هذا الجهاز بعد. افتحه مرة واحدة وأنت متصل بالإنترنت ليعمل بعدها بدون اتصال، ثم أعد المحاولة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
